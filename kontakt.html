    <main class="fade-in">
      <section class="contact">
        <div class="contact-content">
          <h1>Kontakt meg</h1>

          <h2>Fyll ut skjemaet nedenfor så kommer jeg tilbake til deg så fort som mulig.</h2>

          <form action="kontakt.html" method="POST">
            <div class="form-group">
              <label for="name">Navn</label>
              <input type="text" id="name" name="name" placeholder="Ditt navn" required />
            </div>

            <div class="form-group">
              <label for="email">E-post</label>
              <input type="email" id="email" name="email" placeholder="din@epost.no" required />
            </div>

            <div class="form-group">
              <label for="subject">Emne</label>
              <input type="text" id="subject" name="subject" placeholder="Hva gjelder det?" required />
            </div>

            <div class="form-group">
              <label for="message">Melding</label>
              <textarea id="message" name="message" rows="6" placeholder="Skriv meldingen din..." required></textarea>
            </div>

            <button type="submit">Send melding</button>
          </form>
        </div>
      </section>
    </main>
